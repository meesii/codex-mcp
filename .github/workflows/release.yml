name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: 发布检查 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Install managed ripgrep
        run: npx tsx src/managed-tools/cli.ts ripgrep

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production dependency audit
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

  package:
    name: 生成 Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Check version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json 版本是 $PACKAGE_VERSION，但 Git tag 是 $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build package
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release
          mv release/*.tgz release/codex-mcp.tgz
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1
          cp scripts/uninstall.sh release/uninstall.sh
          cp scripts/uninstall.ps1 release/uninstall.ps1
          cd release
          sha256sum codex-mcp.tgz install.sh install.ps1 uninstall.sh uninstall.ps1 > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/codex-mcp.tgz \
            release/install.sh \
            release/install.ps1 \
            release/uninstall.sh \
            release/uninstall.ps1 \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "codex-mcp $GITHUB_REF_NAME"

  publish-npm:
    name: 发布到 npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Check version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json 版本是 $PACKAGE_VERSION，但 Git tag 是 $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION 已经在 npm 上，跳过发布"
            exit 0
          fi
          npm publish --access public --provenance
