name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: 发布检查 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Install managed ripgrep
        run: npx tsx src/managed-tools/cli.ts ripgrep

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build install package
        run: |
          node -e "
            const { appendFileSync } = require('node:fs');
            const { execSync } = require('node:child_process');
            const data = JSON.parse(execSync('npm pack --json', { encoding: 'utf8' }));
            const filename = (Array.isArray(data) ? data[0] : data).filename;
            appendFileSync(process.env.GITHUB_ENV, 'PACK_FILE=' + filename + '\n');
          "

      - name: Smoke test installer (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TEST_HOME="$(mktemp -d)"
          HOME="$TEST_HOME" \
          SHELL=/bin/sh \
          CODEX_MCP_PACKAGE="$PWD/$PACK_FILE" \
          sh scripts/install.sh
          "$TEST_HOME/.codex-mcp/npm/bin/codex-mcp" --version
          HOME="$TEST_HOME" \
          CODEX_MCP_PACKAGE="$PWD/$PACK_FILE" \
          "$TEST_HOME/.codex-mcp/npm/bin/codex-mcp" update
          test "$(HOME="$TEST_HOME" "$TEST_HOME/.codex-mcp/npm/bin/codex-mcp" --version)" = "$VERSION"
          test -x "$TEST_HOME/.codex-mcp/bin/rg"
          "$TEST_HOME/.codex-mcp/bin/rg" --version

          TOOLS_CLI="$TEST_HOME/.codex-mcp/npm/lib/node_modules/@meesii/codex-mcp/dist/managed-tools/cli.js"
          HOME="$TEST_HOME" node "$TOOLS_CLI" cloudflared
          test -x "$TEST_HOME/.codex-mcp/bin/cloudflared"
          "$TEST_HOME/.codex-mcp/bin/cloudflared" --version

          PASSWORD_MODULE="$TEST_HOME/.codex-mcp/npm/lib/node_modules/@meesii/codex-mcp/dist/auth/password-store.js"
          HOME="$TEST_HOME" node --input-type=module --eval '
            import { pathToFileURL } from "node:url";
            const store = await import(pathToFileURL(process.argv[1]).href);
            await store.setAdminPassword("release smoke password 123");
          ' "$PASSWORD_MODULE"
          HOME="$TEST_HOME" node --input-type=module --eval '
            import { pathToFileURL } from "node:url";
            const store = await import(pathToFileURL(process.argv[1]).href);
            if (!(await store.hasAdminPassword())) process.exit(1);
            if (!(await store.verifyAdminPassword("release smoke password 123"))) process.exit(2);
          ' "$PASSWORD_MODULE"

          HOME="$TEST_HOME" sh scripts/uninstall.sh
          test ! -e "$TEST_HOME/.codex-mcp/npm"
          test ! -e "$TEST_HOME/.codex-mcp/bin"
          test -f "$TEST_HOME/.codex-mcp/auth.json"
          ! grep -F '.codex-mcp/npm/bin' "$TEST_HOME/.profile"

      - name: Smoke test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $package = Join-Path $PWD $env:PACK_FILE
          $testHome = Join-Path $env:RUNNER_TEMP "codex-mcp-install-home"
          $installRoot = Join-Path $testHome ".codex-mcp/npm"
          $managedBin = Join-Path $testHome ".codex-mcp/bin"
          $shadowDir = Join-Path $env:RUNNER_TEMP "codex-mcp-old-shadow"
          $originalUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $baseProcessPath = $env:Path

          New-Item -ItemType Directory -Force -Path $testHome | Out-Null
          New-Item -ItemType Directory -Force -Path $shadowDir | Out-Null
          Set-Content -LiteralPath (Join-Path $shadowDir "codex-mcp.cmd") -Value "@echo shadow-old" -Encoding ascii
          [Environment]::SetEnvironmentVariable("Path", $shadowDir, "User")
          $env:Path = "$shadowDir;$baseProcessPath"
          $env:USERPROFILE = $testHome
          $env:CODEX_MCP_PACKAGE = $package

          # Reproduce the saved-script invocation used by Windows PowerShell 5.1
          # users. Explicit UTF-8 decoding avoids Windows PowerShell's legacy
          # no-BOM script-file decoding while still exercising its native
          # argument passing to node/npm.
          $installerPath = Join-Path $PWD "scripts/install.ps1"
          $legacyCommand = "iex (Get-Content -Raw -Encoding UTF8 '$installerPath')"
          & powershell.exe -NoProfile -Command $legacyCommand
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 iex installer smoke test failed"
          }
          & powershell.exe -NoProfile -File $installerPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 -File installer smoke test failed"
          }

          $persistedUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $firstUserPath = ($persistedUserPath -split ";" | Where-Object { $_ -and $_.Trim() -ne "" })[0]
          if (-not [string]::Equals(
              $firstUserPath.TrimEnd('\'),
              $installRoot.TrimEnd('\'),
              [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw "codex-mcp install directory is not first in the Windows User PATH"
          }

          $env:Path = "$persistedUserPath;$baseProcessPath"
          $resolvedCommand = (Get-Command codex-mcp -ErrorAction Stop).Source
          if (-not $resolvedCommand.StartsWith($installRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "codex-mcp resolves to an older command after installation: $resolvedCommand"
          }
          if ((& codex-mcp --version) -ne $version) {
            throw "codex-mcp version resolution smoke test failed"
          }
          & codex-mcp update
          if ($LASTEXITCODE -ne 0) { throw "codex-mcp update smoke test failed" }
          if ((& codex-mcp --version) -ne $version) {
            throw "codex-mcp update changed to an unexpected version"
          }

          $rgPath = Join-Path $managedBin "rg.exe"
          if (-not (Test-Path -LiteralPath $rgPath)) { throw "managed ripgrep was not installed" }
          & $rgPath --version
          if ($LASTEXITCODE -ne 0) { throw "managed ripgrep smoke test failed" }

          $toolsCli = Join-Path $installRoot "node_modules/@meesii/codex-mcp/dist/managed-tools/cli.js"
          & node $toolsCli cloudflared
          if ($LASTEXITCODE -ne 0) { throw "managed cloudflared install smoke test failed" }
          $cloudflaredPath = Join-Path $managedBin "cloudflared.exe"
          if (-not (Test-Path -LiteralPath $cloudflaredPath)) { throw "managed cloudflared was not installed" }
          & $cloudflaredPath --version
          if ($LASTEXITCODE -ne 0) { throw "managed cloudflared smoke test failed" }

          $passwordModule = Join-Path $installRoot "node_modules/@meesii/codex-mcp/dist/auth/password-store.js"
          $setPasswordScript = 'import { pathToFileURL } from "node:url"; const store = await import(pathToFileURL(process.argv[1]).href); await store.setAdminPassword("release smoke password 123");'
          & node --input-type=module --eval $setPasswordScript $passwordModule
          if ($LASTEXITCODE -ne 0) { throw "password write smoke test failed" }

          $verifyPasswordScript = 'import { pathToFileURL } from "node:url"; const store = await import(pathToFileURL(process.argv[1]).href); if (!(await store.hasAdminPassword())) process.exit(1); if (!(await store.verifyAdminPassword("release smoke password 123"))) process.exit(2);'
          & node --input-type=module --eval $verifyPasswordScript $passwordModule
          if ($LASTEXITCODE -ne 0) { throw "password persistence smoke test failed" }

          $uninstallerPath = Join-Path $PWD "scripts/uninstall.ps1"
          & powershell.exe -NoProfile -File $uninstallerPath
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 uninstaller smoke test failed" }
          if (Test-Path $installRoot) {
            throw "codex-mcp uninstall smoke test failed"
          }
          if (Test-Path $managedBin) {
            throw "codex-mcp uninstall left managed binaries behind"
          }
          if (-not (Test-Path (Join-Path $testHome ".codex-mcp/auth.json"))) {
            throw "codex-mcp uninstall removed the saved password"
          }
          $remainingUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $remainingInstallEntries = @(
            $remainingUserPath -split ";" | Where-Object {
              $_ -and [string]::Equals(
                  $_.Trim().TrimEnd('\'),
                  $installRoot.TrimEnd('\'),
                  [System.StringComparison]::OrdinalIgnoreCase
              )
            }
          )
          if ($remainingInstallEntries.Count -ne 0) {
            throw "codex-mcp uninstall left its Windows PATH entry behind"
          }

          [Environment]::SetEnvironmentVariable("Path", $originalUserPath, "User")

  package:
    name: 生成 Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Check version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json 版本是 $PACKAGE_VERSION，但 Git tag 是 $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build package
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release
          mv release/*.tgz release/codex-mcp.tgz
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1
          cp scripts/uninstall.sh release/uninstall.sh
          cp scripts/uninstall.ps1 release/uninstall.ps1
          cd release
          sha256sum codex-mcp.tgz install.sh install.ps1 uninstall.sh uninstall.ps1 > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/codex-mcp.tgz \
            release/install.sh \
            release/install.ps1 \
            release/uninstall.sh \
            release/uninstall.ps1 \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "codex-mcp $GITHUB_REF_NAME"

  publish-npm:
    name: 发布到 npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Check version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json 版本是 $PACKAGE_VERSION，但 Git tag 是 $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION 已经在 npm 上，跳过发布"
            exit 0
          fi
          npm publish --access public --provenance
