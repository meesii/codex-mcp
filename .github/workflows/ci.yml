name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Install managed ripgrep
        run: npx tsx src/managed-tools/cli.ts ripgrep

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Production dependency audit
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
