name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org

      - name: Install managed ripgrep
        run: npx tsx src/managed-tools/cli.ts ripgrep

      - name: Typecheck
        run: npm run typecheck

      - name: Test built CLI and safety boundaries
        run: npm test

      - name: Package and isolated install smoke
        run: npm run test:package

      - name: Production dependency audit
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
